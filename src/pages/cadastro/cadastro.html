<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de cadastro </title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/pages/cadastro/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <div class="card">
        <div class="texto">
            <h1>CRIAR CONTA</h1>
            <p>Preencha seus dados para continuar</p>
        </div>
        <div class="inputs">
            <form action="#" method="post">
                <!--Campo do nome-->
                <div class="input-campo">
                    <input type="text" placeholder="nome completo" required>
                </div>

                <!--Campo do Email-->
                <div class="input-campo">
                    <input type="email" placeholder="Digite seu e-mail" required>
                </div>

                <!--Telefone / Whatsapp-->
                <div class="input-campo">
                    <input type="tel" placeholder="Digite seu telefone">
                </div>

                <!--Senha-->
                <div class="input-campo">
                    <input type="password" placeholder="Digite sua senha" id="senha">
                    <button type="button" class="fa-solid fa-eye-slash icon-right" id="btn-senha" ></button> 
                </div>

                <div class="input-campo">
                    <input type="password" placeholder="Digite sua novamente" id="">
                    <button type="button" class="fa-solid fa-eye-slash icon-right" id=""></button> 
                </div>

                <button type="submit" class="btn-registro">REGISTAR</button>
            </form>
        </div>
    </div>


    <script src="scripts.js"></script>
</body>
</html>
