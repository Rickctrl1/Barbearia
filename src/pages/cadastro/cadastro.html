<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de cadastro </title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/pages/cadastro/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <div class="card">
        <!--lado esquerdo-->
        <div class="texto">
            <h1>CRIAR CONTA</h1>
            <p>Preencha seus dados para continuar</p>
        </div>
        
        <!--Lado direito-->
        <div class="inputs">
            <form action="#" method="post">
                <!--Campo do nome-->
                <p>nome completo</p>
                <div class="input-campo">
                    <input type="text" placeholder="" required>
                </div>

                <!--Campo do Email-->
                <p>E-mail</p>
                <div class="input-campo">
                    <input type="email" placeholder="" required>
                </div>

                <!--Telefone / Whatsapp-->
                <p>Telefone</p>
                <div class="input-campo">
                    <input type="tel" placeholder="">
                </div>

                <!--Senha-->
                <p>Senha (min. 10 caracteres)</p>
                <div class="input-campo">
                    <input type="password" placeholder="" id="senha">
                    <button type="button" class="fa-solid fa-eye-slash icon-right" id="btn-senha" ></button> 
                </div>

                <p>Digite sua novamente</p>
                <div class="input-campo">
                    <input type="password" placeholder="" id="senha-confirmacao">
                    <button type="button" class="fa-solid fa-eye-slash icon-right" id="btn-senha-confirmacao"></button> 
                </div>

                <button type="submit" class="btn-registro">REGISTAR</button>
            </form>
        </div>
    </div>


    <script src="scripts.js"></script>
</body>
</html>
